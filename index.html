<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blocket Pro Dashboard</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a}
header{background:#0f172a;color:#fff;padding:16px 24px}header b{color:#f97316}
main{max-width:1100px;margin:auto;padding:20px}
.filters button{border:1px solid #cbd5e1;background:#fff;padding:6px 12px;border-radius:999px;margin:0 6px 6px 0;cursor:pointer}
.filters button.on{background:#ea580c;color:#fff;border-color:#ea580c}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
.card h3{margin:0 0 6px;font-size:13px;color:#475569}.card .v{font-size:22px;font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:160px}.bars div{flex:1;text-align:center;font-size:11px}
.bars span{display:block;background:#ea580c;border-radius:4px 4px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left}
</style>
</head>
<body>
<header><b>Blocket</b> Pro — Factory Dashboard</header>
<main>
<div class="filters" id="filters"></div>
<div class="grid" id="kpis"></div>
<div class="card"><h3>Revenue — last 7 days (ETB)</h3><div class="bars" id="trend"></div></div>
<div class="grid">
<div class="card"><h3>Product stock</h3><table id="stock"></table></div>
<div class="card"><h3>Open balances</h3><table id="orders"></table></div>
</div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
